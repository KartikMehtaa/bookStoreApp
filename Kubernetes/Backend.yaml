apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: bookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-myapp

  template:
    metadata:
      labels:
        app: backend-myapp

    spec:
      containers:
        - name: backend-container
          image: kartikmehta/bookapp-backend:latest

          ports:
            - containerPort: 4000

          envFrom:
            - configMapRef:
                name: configmap

          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"