apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: bookstore
spec:
  selector:
    matchLabels:
      app: backend-myapp
  template:
    metadata:
      labels:
        app: backend-myapp
    spec:
      containers:
      - name: backend-container
        image: kartikmehta/bookapp-backend:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 4000
